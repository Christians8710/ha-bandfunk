name: Release-Draft vorbereiten
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  draft:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-build.txt aiohttp==3.11.18
      - run: python -m pytest tests -q
      - run: python -m platformio run --project-dir firmware
      - name: Reproduzierbares HACS-ZIP
        run: |
          python - <<'PY'
          from pathlib import Path
          from tools.release import deterministic_zip
          base=Path('custom_components/bandfunk')
          deterministic_zip(Path('bandfunk.zip'),[p for p in base.rglob('*') if p.is_file() and '__pycache__' not in p.parts],base)
          PY
      - name: Draft erzeugen, niemals automatisch publizieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.2 --draft --target "$GITHUB_SHA" --title 'BandFunk 0.2.2' --notes 'Release-Entwurf. Signierte OTA-Datei offline ergänzen und Prüfsummen kontrollieren. Anleitung und Gerätetests stehen im Repository.' bandfunk.zip firmware/.pio/build/d1_mini/firmware.bin
