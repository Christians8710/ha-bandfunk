name: Build und Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Paket-, Timing- und Provisionierungs-Regressionspruefungen
        run: g++ -std=c++11 -Wall -Wextra -Werror -Ifirmware/include firmware/test/native/test_protocol.cpp -o /tmp/bandfunk-test && /tmp/bandfunk-test
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-build.txt aiohttp==3.11.18
      - run: python -m pytest tests -q
      - name: HA-Tests in separater Umgebung mit HA-eigenen Abhaengigkeiten
        run: |
          python -m venv /tmp/ha-test
          /tmp/ha-test/bin/pip install homeassistant==2025.1.4 pytest==8.3.5
          /tmp/ha-test/bin/python -m pytest tests/test_ha.py -q
      - run: python -m compileall -q custom_components tools
      - run: python -m platformio run --project-dir firmware
      - run: python tools/check_stack.py firmware/.pio/build/d1_mini/src/main.cpp.su
      - uses: actions/upload-artifact@v4
        with:
          name: bandfunk-firmware-build
          path: |
            firmware/.pio/build/d1_mini/firmware.bin
            firmware/.pio/build/d1_mini/firmware.elf
            keys/ota-public.pem
  hacs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands
  hassfest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
